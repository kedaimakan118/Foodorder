name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          unzip -q FoodOrderingPOS_AndroidStudio_Project.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/FoodOrderingPOS
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FoodOrderingPOS-APK
          path: extracted/FoodOrderingPOS/app/build/outputs/apk/debug/app-debug.apk
